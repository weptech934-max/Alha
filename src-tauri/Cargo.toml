[package]
name = "topvon-desktop"
version = "0.1.0"
description = "Topvon AI desktop workspace"
authors = ["Topvon"]
edition = "2021"

[lib]
name = "topvon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "topvon-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
